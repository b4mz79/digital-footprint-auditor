name: Packaging Environment Validation

on:
  push:
    branches:
      - feat/evidence-enrichment-foundation
  pull_request:
    branches:
      - main
      - feat/evidence-enrichment-foundation

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows / Python 3.12
            os: windows-latest
            python-version: "3.12"
            lockfile: packaging/locks/windows-py312.lock.txt
          - name: Ubuntu / Python 3.14
            os: ubuntu-latest
            python-version: "3.14"
            lockfile: packaging/locks/linux-py314.lock.txt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install pinned environment
        run: python -m pip install -r ${{ matrix.lockfile }}

      - name: Validate dependency consistency
        run: python -m pip check

      - name: Validate packaging inputs and lockfiles
        run: python packaging/check_packaging.py

      - name: Run test suite
        run: python -m pytest -q

      - name: Build Windows distribution smoke test
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller packaging\PrivacyAuditor.spec --noconfirm
          if (!(Test-Path "dist\PrivacyAuditor\PrivacyAuditor.exe")) {
            throw "PrivacyAuditor.exe was not created by the pinned Windows environment."
          }
